<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1150" viewBox="0 0 1600 1150">
  <title>Medical and reanimation — dimensioned interior floorplan P01</title>
  <desc>Original metric floorplan. Main room 8 by 9 metres plus a 2.2 by 3.8 metre recovery alcove. One 2.2 metre exterior sliding entry at origin, a central OCRU, west and east bypasses and rear maintenance access. The optional obstruction-test layer shows a dropped body and a transverse cart blocking central arrival while the east internal personnel route remains outside their footprints. Runtime clearing, collision and ragdoll behaviour are unverified.</desc>
  <defs>
    <marker id="dim-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M8 0L0 4L8 8" fill="none" stroke="#657078" stroke-width="1.4"/></marker>
    <marker id="route-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#31776f"/></marker>
    <pattern id="decon-hatch" patternUnits="userSpaceOnUse" width="14" height="14"><path d="M0 14L14 0" stroke="#d9caa4" stroke-width="1"/></pattern>
    <pattern id="storage-hatch" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M0 8L8 0" stroke="#c1c9ce" stroke-width="1"/></pattern>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #243841; }
      .title { font-size: 32px; font-weight: 650; }
      .subtitle { font-size: 16px; fill: #586970; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
      .label { font-size: 15px; font-weight: 650; }
      .dim { stroke: #657078; stroke-width: 1.2; fill: none; }
      .dimtext { font-size: 14px; fill: #53646d; }
      .equip { fill: #9eb5b0; stroke: #345851; stroke-width: 2; }
      .leader { fill: none; stroke: #687b82; stroke-width: 1.1; }
      .number { font-size: 12px; font-weight: 700; text-anchor: middle; fill: white; }
      .panelheading { font-size: 18px; font-weight: 650; }
      .panelbody { font-size: 15px; }
    </style>
  </defs>
  <rect width="1600" height="1150" fill="#f9faf8"/>
  <path d="M40 96H1560" stroke="#cad3d6"/>
  <text class="title" x="40" y="52">Medical &amp; reanimation</text>
  <text class="subtitle" x="40" y="79">OCRU / original interior plan / P01 / 08 September 2026</text>
  <text class="subtitle" x="1560" y="52" text-anchor="end">Local metric contract</text>
  <text class="subtitle" x="1560" y="78" text-anchor="end">80.36 m² gross interior floor area</text>

