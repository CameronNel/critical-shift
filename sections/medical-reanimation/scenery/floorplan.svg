  <g id="schedule">
    <rect x="1040" y="123" width="520" height="897" rx="8" fill="#edf1ef"/>
    <text class="panelheading" x="1064" y="159">DIMENSION &amp; FUNCTION SCHEDULE</text>
    <text class="panelbody" x="1064" y="191">Main ceiling: 3.60 m · alcove ceiling: 3.15 m</text>
    <text class="panelbody" x="1064" y="214">Entry clear height: 2.50 m</text>
    <text class="panelbody" x="1064" y="237">Alcove opening height: 3.15 m</text>
    <text class="panelbody" x="1064" y="260">Opened OCRU canopy: maximum z 2.40 m</text>
    <path d="M1064 274H1536" stroke="#c8d1ce"/>

    <text class="label" x="1064" y="292">01  Gross-decontamination wash fixture</text>
    <text class="panelbody" x="1093" y="315">Nominal bay 0.90 × 1.50 m; basin width 0.98 m.</text>
    <text class="label" x="1064" y="350">02  Cart parking</text>
    <text class="panelbody" x="1093" y="373">1.20 × 2.40 m bay; illustrated cart 0.75 × 2.00 m.</text>
    <text class="label" x="1064" y="408">03  OCRU / supported adult berth</text>
    <text class="panelbody" x="1093" y="431">Centre (0.55, 6.20); envelope 1.80 × 3.30 m.</text>
    <text class="label" x="1064" y="466">04–06  Controls, cartridge &amp; suit service</text>
    <text class="panelbody" x="1093" y="489">Controls: z 1.10 m; cartridge: west side, y 5.00.</text>
    <text class="label" x="1064" y="524">07  Consumables / reserve battery</text>
    <text class="panelbody" x="1093" y="547">West bay y 6.70–8.60; battery top z 1.25 m.</text>
    <text class="panelbody" x="1093" y="570">Battery footprint 0.55 × 1.00 m; rear supply flush.</text>
    <text class="label" x="1064" y="605">08  Small recovery alcove</text>
    <text class="panelbody" x="1093" y="628">2.20 × 3.80 m; 0.95 × 2.20 m bed, pillow +Y.</text>
    <path d="M1064 649H1536" stroke="#c8d1ce"/>

    <text class="panelheading" x="1064" y="683">INTERFACE CONTRACT</text>
    <text class="panelbody" x="1064" y="711">One exterior portal: the front sliding entry.</text>
    <text class="panelbody" x="1064" y="736">P / LV / W / D: rear utility termination allowances.</text>
    <text class="panelbody" x="1064" y="761">No neighbouring module or global link is assumed.</text>
    <path d="M1064 781H1536" stroke="#c8d1ce"/>

    <text class="panelheading" x="1064" y="814">OPTIONAL OBSTRUCTION LAYER</text>
    <text class="panelbody" x="1064" y="842">Dashed body/cart footprints obstruct central arrival.</text>
    <text class="panelbody" x="1064" y="867">East personnel bypass remains outside footprints.</text>
    <text class="panelbody" x="1064" y="892">Other placements can block the doorway or loading.</text>
    <text class="panelbody" x="1064" y="917">Manual clearing/drag integration is required.</text>
    <text class="panelbody" x="1064" y="942">Collision, turning and ragdoll physics are unverified.</text>
    <text class="small" x="1064" y="968">Body centre (0, 1.90) · cart centre (0, 2.90)</text>
    <text class="small" x="1064" y="992">SVG group: obstruction-test · individual / combined tests</text>
  </g>

  <g id="footer">
    <path d="M40 1039H1560" stroke="#cad3d6"/>
    <text class="small" x="40" y="1070">Interior dimensions are exact authored decisions. Walls are schematic strokes; thickness is additional.</text>
    <text class="small" x="40" y="1092">80.36 m² = (8.00 × 9.00) + (2.20 × 3.80). Equipment deductions excluded. See interface.json for coordinates.</text>
    <text class="small" x="40" y="1114">Source: GAME_SPEC §§5, 23 + canonical ART_DIRECTION + facility-run medical brief. P01 is a plan, not an acceptance record.</text>
