    <path d="M1296 1065V1085M1376 1065V1085M1456 1065V1085M1536 1065V1085" stroke="#40555c"/>
    <text class="small" x="1296" y="1104" text-anchor="middle">0</text><text class="small" x="1376" y="1104" text-anchor="middle">1</text><text class="small" x="1456" y="1104" text-anchor="middle">2</text><text class="small" x="1536" y="1104" text-anchor="middle">3 m</text>
