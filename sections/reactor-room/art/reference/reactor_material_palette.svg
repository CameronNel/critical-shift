<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1719"/><stop offset="1" stop-color="#182529"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5f6665"/><stop offset="1" stop-color="#303737"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9eefff"/><stop offset="1" stop-color="#14a8c7"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="28" y="24" width="1544" height="852" rx="18" fill="none" stroke="#31464b" stroke-width="2"/>
  <text x="60" y="78" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="40">REACTOR ROOM — MATERIAL + COLOUR</text>
  <text x="60" y="112" fill="#d8aa3d" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="3">CRITICAL SHIFT — GROUNDED STYLIZED SEMI-REALISM</text>
  
<g transform="translate(60,150)" font-family="Arial">
 <rect width="1480" height="610" rx="12" fill="#111c1e" stroke="#33484c"/>
 <text x="35" y="50" fill="#f2f1e9" font-size="26" font-weight="700">REACTOR MATERIAL / COLOUR HIERARCHY</text>
 <g transform="translate(40,85)">
  <rect width="250" height="180" rx="10" fill="#d3d0c5"/><text x="18" y="150" fill="#263234" font-size="19" font-weight="700">OFF-WHITE STRUCTURE</text><text x="18" y="172" fill="#485557" font-size="14">quiet background</text>
  <rect x="280" width="250" height="180" rx="10" fill="#445d5e"/><text x="298" y="150" fill="#f3f1e8" font-size="19" font-weight="700">BLUE-GREEN EQUIPMENT</text><text x="298" y="172" fill="#d3dedf" font-size="14">controlled machinery</text>
  <rect x="560" width="250" height="180" rx="10" fill="#d4a42e"/><text x="578" y="150" fill="#243033" font-size="19" font-weight="700">HAZARD YELLOW</text><text x="578" y="172" fill="#344143" font-size="14">functional accent</text>
  <rect x="840" width="250" height="180" rx="10" fill="#2c3335"/><text x="858" y="150" fill="#f3f1e8" font-size="19" font-weight="700">CHARCOAL</text><text x="858" y="172" fill="#c2cdcf" font-size="14">floors / rubber / depth</text>
  <rect x="1120" width="250" height="180" rx="10" fill="#20b9d9"/><text x="1138" y="150" fill="#08323b" font-size="19" font-weight="700">CYAN POOL</text><text x="1138" y="172" fill="#0d4652" font-size="14">hero emissive landmark</text>
 </g>
 <g transform="translate(40,315)">
  <rect width="630" height="200" rx="10" fill="#1b292c"/>
  <text x="22" y="38" fill="#71c98a" font-size="22" font-weight="700">USE</text>
  <text x="22" y="76" fill="#d8dad4" font-size="18">✓ broad painted-metal roughness variation</text>
  <text x="22" y="110" fill="#d8dad4" font-size="18">✓ sparse maintenance wear at controls and routes</text>
  <text x="22" y="144" fill="#d8dad4" font-size="18">✓ analogue gauges + early digital displays</text>
  <text x="22" y="178" fill="#d8dad4" font-size="18">✓ strong cool pool bounce against neutral structure</text>
  <rect x="700" width="670" height="200" rx="10" fill="#1b292c"/>
  <text x="722" y="38" fill="#ef6b5d" font-size="22" font-weight="700">AVOID</text>
  <text x="722" y="76" fill="#d8dad4" font-size="18">× photoreal brushed-metal microdetail</text>
  <text x="722" y="110" fill="#d8dad4" font-size="18">× pipe spaghetti / random industrial greebles</text>
  <text x="722" y="144" fill="#d8dad4" font-size="18">× glowing sci-fi strips and holograms</text>
  <text x="722" y="178" fill="#d8dad4" font-size="18">× uniformly sterile surfaces with no evidence of use</text>
 </g>
</g>
  <text x="60" y="852" fill="#8fa3a6" font-family="Arial,Helvetica,sans-serif" font-size="15">Directional reference only. Believable first. Stylized second. Readable always.</text>
