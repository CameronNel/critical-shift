<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1416"/><stop offset="1" stop-color="#182528"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="24" y="24" width="1552" height="852" rx="18" fill="none" stroke="#30464a" stroke-width="2"/>
<text x="58" y="72" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">LARGER BUILDING ILLUSION</text>
<text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">THE PLAYABLE AREA IS A SLICE OF A MUCH BIGGER FACILITY</text>
<rect x="52" y="140" width="930" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="72" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">LARGER BUILDING ILLUSION</text><rect x="90" y="190" width="830" height="490" fill="#202b2d"/>
<rect x="170" y="250" width="180" height="310" fill="#31504e"/><rect x="195" y="275" width="130" height="260" fill="#232f31"/>
<rect x="430" y="260" width="220" height="290" fill="#d2a32f"/><rect x="465" y="295" width="150" height="200" fill="#293638"/>
<rect x="700" y="280" width="150" height="240" fill="#536363"/><rect x="730" y="315" width="90" height="150" fill="#1e292b"/>
<line x1="120" y1="220" x2="890" y2="220" stroke="#596c6c" stroke-width="20"/><line x1="740" y1="210" x2="740" y2="120" stroke="#596c6c" stroke-width="18"/>
<line x1="600" y1="235" x2="960" y2="235" stroke="#33494b" stroke-width="8"/>
<text x="120" y="645" fill="#b8c5c3" font-family="Arial" font-size="16">Utilities, numbering, deep reveals and glimpses continue beyond the playable slice.</text><rect x="1010" y="140" width="530" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1030" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">SCALE CUES</text><text x="1035" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Use</text>
<text x="1035" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• service doors that remain locked</text>
<text x="1035" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• room/sector numbers implying sequence</text>
<text x="1035" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• ducts continuing through walls</text>
<text x="1035" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• cable tray disappearing out of view</text>
<text x="1035" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• wired-glass glimpse of stair/service route</text>
<text x="1035" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• distant PA / machine hum</text>
<text x="1035" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• structural rhythm continuing beyond</text>
<text x="1035" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1035" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Do not</text>
<text x="1035" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• build huge empty inaccessible rooms</text>
<text x="1035" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• tease gorgeous locked spaces players chase</text>
<text x="1035" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• add random fake doors every metre</text>
<text x="1035" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• use signs alone to imply scale</text>
<text x="1035" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1035" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">The player should think:</text>
<text x="1035" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">“This is one prep corridor in a huge institution,”</text>
<text x="1035" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">not “the map ends behind this wall.”</text>
<text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text></svg>