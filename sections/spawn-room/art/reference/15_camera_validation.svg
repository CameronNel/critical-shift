 <text x="114" y="506" fill="#aebcba" font-family="Arial" font-size="14">support contact + circulation</text>
 <rect x="114" y="532" width="220" height="40" fill="#334648"/><rect x="392" y="420" width="265" height="175" rx="10" fill="#1d2a2d"/>
