<text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">THE ROOM IS JUDGED FROM GAMEPLAY, NOT THE BLENDER FREE CAMERA</text>
