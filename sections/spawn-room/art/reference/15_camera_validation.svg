 <text x="714" y="506" fill="#aebcba" font-family="Arial" font-size="14">wall/floor/metal/fabric separation</text>
 <rect x="714" y="532" width="220" height="40" fill="#334648"/><rect x="1050" y="140" width="490" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1070" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">EVERY CAMERA CHECKS</text><text x="1075" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• player-height scale</text>
<text x="1075" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• silhouette readability</text>
<text x="1075" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• no floating props</text>
<text x="1075" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• no wall penetrations</text>
<text x="1075" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• material differentiation</text>
<text x="1075" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• contact shadows</text>
<text x="1075" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• lighting falloff</text>
<text x="1075" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• route clearance</text>
<text x="1075" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• signage restraint</text>
<text x="1075" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• quiet space vs focal clusters</text>
<text x="1075" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• PPE reads as clothing</text>
<text x="1075" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• no repeated box language</text>
<text x="1075" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1075" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Camera transforms lock once review begins.</text>
<text x="1075" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Do not move a camera to hide a defect.</text>
<text x="1075" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1075" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">At least one camera must be intentionally</text>
<text x="1075" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">unflattering and diagnostic.</text>
<text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text></svg>