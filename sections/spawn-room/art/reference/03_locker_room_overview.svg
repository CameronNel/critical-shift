<text x="145" y="650" fill="#b8c5c3" font-family="Arial" font-size="16">4 distinct worker positions + central integrity chamber + circulation around, not through, prop clutter.</text><rect x="1080" y="140" width="460" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1100" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">LOCKER ROOM RULES</text><text x="1105" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Exactly four primary suit stations.</text>
<text x="1105" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1105" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Bay module target</text>
<text x="1105" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 0.9–1.1 m wide</text>
<text x="1105" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 0.55–0.70 m deep</text>
<text x="1105" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 2.1–2.3 m high</text>
<text x="1105" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• shallow recess, not giant pod</text>
<text x="1105" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1105" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Central chamber target</text>
<text x="1105" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1.8–2.2 m footprint</text>
<text x="1105" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 2.6–3.0 m high</text>
<text x="1105" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1.2 m+ clear circulation</text>
<text x="1105" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1105" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Variation</text>
<text x="1105" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one note / card per bay max</text>
<text x="1105" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• helmet angle differences</text>
<text x="1105" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• player ID color accents</text>
<text x="1105" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one maintenance tag</text>
<text x="1105" y="671" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1105" y="698" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Do not make the room a retail PPE showroom.</text>
<text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text>
