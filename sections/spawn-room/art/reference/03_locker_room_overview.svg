<text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">FOUR WORKER POSITIONS AROUND ONE CENTRAL SAFETY MACHINE</text>
<rect x="52" y="140" width="1000" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="72" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">LOCKER / SUITING ROOM — HERO AREA</text><rect x="90" y="185" width="920" height="500" fill="#202b2d"/>
