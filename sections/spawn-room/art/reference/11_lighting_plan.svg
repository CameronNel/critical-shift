<text x="115" y="678" fill="#b8c5c3" font-family="Arial" font-size="16">Warm/neutral prep light + cooler operational threshold. Corners retain shadow.</text><rect x="1010" y="140" width="530" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1030" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">LIGHTING TARGETS</text><text x="1035" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Hallway</text>
