<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1416"/><stop offset="1" stop-color="#182528"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="24" y="24" width="1552" height="852" rx="18" fill="none" stroke="#30464a" stroke-width="2"/>
<text x="58" y="72" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">SPAWN ROOM MASTER OVERVIEW</text>
<text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">WHAT THE PLAYER SHOULD READ IN THE FIRST FIVE SECONDS</text>
<rect x="52" y="140" width="960" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="72" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">MASTER GAMEPLAY VIEW / COMPOSITION</text><polygon points="105,695 930,695 820,330 250,330" fill="#515b5c"/>
<polygon points="250,330 820,330 820,215 250,215" fill="#c6c3b8"/>
<polygon points="105,695 250,330 250,215 90,270" fill="#868a84"/>
<polygon points="930,695 820,330 820,215 955,280" fill="#868a84"/>
<rect x="330" y="270" width="160" height="345" fill="#2e4b49"/><rect x="360" y="295" width="100" height="285" fill="#1f2b2d"/>
<rect x="610" y="270" width="170" height="345" fill="#d3a12d"/><rect x="640" y="295" width="110" height="245" fill="#2b3638"/>
<rect x="165" y="470" width="250" height="28" fill="#6d5435"/><rect x="190" y="498" width="14" height="110" fill="#374244"/><rect x="375" y="498" width="14" height="110" fill="#374244"/>
<rect x="460" y="242" width="235" height="16" fill="#f6ecc8"/>
<rect x="270" y="645" width="510" height="14" fill="#d5a42f" opacity=".85"/>
<text x="112" y="735" fill="#d6e0de" font-family="Arial" font-size="18">Readable route: LEFT briefing • RIGHT locker/PPE • FORWARD operations</text><rect x="1040" y="140" width="500" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1060" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">NON-NEGOTIABLE READ</text><text x="1068" y="200" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">1. Player instantly understands the 3-way choice.</text>
<text x="1068" y="234" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">2. Locker room is the visual hero side-space.</text>
<text x="1068" y="268" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">3. Operational exit is visually heavier than interior doors.</text>
<text x="1068" y="302" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">4. Signage supports the read, never creates it.</text>
<text x="1068" y="336" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">5. Human-use props cluster around work surfaces.</text>
<text x="1068" y="370" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">6. Quiet wall and floor areas remain visible.</text>
<text x="1068" y="404" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">7. PPE reads as clothing, not a showroom mannequin.</text>
<text x="1068" y="438" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">8. Lighting creates warm/cool zones and depth.</text>
<text x="1068" y="472" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">9. Every wall-mounted object visibly contacts its wall.</text>
<text x="1068" y="506" fill="#d9e1df" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">10. Facility feels larger than the playable slice.</text><text x="1068" y="585" fill="#ef6b5d" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">HARD FAIL:</text><text x="1068" y="620" fill="#efb1a9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">bevelled boxes • plastic sameness • flat light • wall gadget spam • toy suits</text>
<text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text>
</svg>