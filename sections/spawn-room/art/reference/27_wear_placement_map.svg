<text x="130" y="665" fill="#b8c5c3" font-family="Arial" font-size="16">Red markers = plausible touch / impact / traffic zones. Most surface stays maintained.</text><rect x="1100" y="140" width="440" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1120" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">LOCALIZE WEAR</text><text x="1125" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">High probability</text>
<text x="1125" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• door handles</text>
<text x="1125" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• thresholds</text>
<text x="1125" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• bench front edge</text>
<text x="1125" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• boot standing zones</text>
<text x="1125" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• locker latch / shelf lip</text>
<text x="1125" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• controller buttons</text>
<text x="1125" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• utility repair areas</text>
<text x="1125" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1125" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Low probability</text>
<text x="1125" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• ceiling centers</text>
<text x="1125" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• upper wall centers</text>
<text x="1125" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• untouched panel faces</text>
<text x="1125" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• symmetric every-edge chips</text>
<text x="1125" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1125" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Target</text>
<text x="1125" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">80–90% maintained</text>
<text x="1125" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">10–20% evidence of use</text>
<text x="1125" y="671" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1125" y="698" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Wear tells a story. Noise does not.</text><text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text></svg>