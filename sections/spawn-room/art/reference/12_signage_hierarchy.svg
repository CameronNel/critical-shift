<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1416"/><stop offset="1" stop-color="#182528"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="24" y="24" width="1552" height="852" rx="18" fill="none" stroke="#30464a" stroke-width="2"/>
<text x="58" y="72" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">SIGNAGE</text>
<text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">FUNCTIONAL INFORMATION, NOT TEXTURE FILLER</text>
<rect x="52" y="140" width="930" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="72" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">SIGNAGE HIERARCHY</text><rect x="90" y="190" width="830" height="490" fill="#bdb9ad"/>
<rect x="145" y="250" width="250" height="150" fill="#31504e"/><text x="175" y="305" fill="#f2f1e9" font-family="Arial" font-size="24" font-weight="700">OPERATIONS →</text><text x="175" y="345" fill="#ced9d7" font-family="Arial" font-size="14">primary navigation</text>
<rect x="465" y="260" width="190" height="110" fill="#d6a42f"/><text x="495" y="305" fill="#263234" font-family="Arial" font-size="20" font-weight="700">RADIATION</text><text x="505" y="335" fill="#263234" font-family="Arial" font-size="14">hazard threshold</text>
<rect x="700" y="260" width="135" height="92" fill="#e6e0d2" stroke="#31504e" stroke-width="5"/><text x="720" y="295" fill="#31504e" font-family="Arial" font-size="15" font-weight="700">SEAL CHECK</text><text x="720" y="325" fill="#536261" font-family="Arial" font-size="12">procedure</text>
<rect x="150" y="475" width="270" height="110" fill="#d5d0c1"/><text x="170" y="510" fill="#354847" font-family="Arial" font-size="16" font-weight="700">CURRENT SHIFT</text><line x1="170" y1="530" x2="390" y2="530" stroke="#80908e"/><line x1="170" y1="550" x2="350" y2="550" stroke="#80908e"/>
<text x="470" y="505" fill="#b34f44" font-family="Arial" font-size="18">✕ No label on every device</text><text x="470" y="545" fill="#b34f44" font-family="Arial" font-size="18">✕ No five signs saying “safe / check / controlled”</text><text x="470" y="585" fill="#71c98a" font-family="Arial" font-size="18">✓ One sign does one useful job</text><rect x="1010" y="140" width="530" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1030" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">TEXT BUDGET</text><text x="1035" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Whole spawn section target</text>
<text x="1035" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1 primary directional system</text>
<text x="1035" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 2–4 hazard/procedure signs</text>
<text x="1035" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1 shift/notice board cluster</text>
<text x="1035" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 2–4 institutional portraits / morale pieces</text>
<text x="1035" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• small station IDs where needed</text>
<text x="1035" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1035" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Hierarchy</text>
<text x="1035" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">1. navigation</text>
<text x="1035" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">2. hazard</text>
<text x="1035" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">3. procedure</text>
<text x="1035" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">4. institutional flavor</text>
<text x="1035" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">5. decorative copy</text>
<text x="1035" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1035" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Rule</text>
<text x="1035" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Delete any sign whose removal does not reduce</text>
<text x="1035" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">navigation, safety, interaction clarity or character.</text>
<text x="1035" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1035" y="671" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">At 3–5 m, shape/color block should read before text.</text>
<text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text></svg>