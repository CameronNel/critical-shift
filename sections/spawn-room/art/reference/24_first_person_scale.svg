<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1416"/><stop offset="1" stop-color="#182528"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="24" y="24" width="1552" height="852" rx="18" fill="none" stroke="#30464a" stroke-width="2"/><text x="58" y="72" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">FIRST-PERSON SCALE</text><text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">PLAYER EYE HEIGHT IS THE REAL ART-DIRECTION CAMERA</text><rect x="52" y="140" width="1000" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="72" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">FIRST-PERSON SCALE / EYE HEIGHT</text><rect x="90" y="190" width="920" height="490" fill="#202b2d"/>
<line x1="120" y1="550" x2="970" y2="550" stroke="#657476" stroke-width="3"/>
<line x1="260" y1="550" x2="260" y2="235" stroke="#d5a42f" stroke-width="5"/><circle cx="260" cy="210" r="30" fill="#d5a42f"/>
<line x1="90" y1="285" x2="1010" y2="285" stroke="#71c98a" stroke-dasharray="10 8" stroke-width="3"/><text x="110" y="275" fill="#71c98a" font-family="Arial" font-size="16">approx. player eye-height band 1.55–1.70 m</text>
<rect x="420" y="220" width="160" height="330" fill="#d4a22e"/><rect x="455" y="250" width="90" height="190" fill="#263436"/>
<rect x="670" y="365" width="180" height="25" fill="#705337"/><rect x="690" y="390" width="14" height="160" fill="#394344"/><rect x="820" y="390" width="14" height="160" fill="#394344"/>
<rect x="890" y="315" width="70" height="155" fill="#d8d1c1" stroke="#36514f" stroke-width="7"/>
<text x="110" y="635" fill="#b8c5c3" font-family="Arial" font-size="16">Mount controls, signs and visual detail where the player actually sees them, not where a beauty camera prefers them.</text><rect x="1080" y="140" width="460" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1100" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">VIEW-HEIGHT RULES</text><text x="1105" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Use gameplay camera for</text>
<text x="1105" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• handle placement</text>
<text x="1105" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• sign readability</text>
<text x="1105" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• meter height</text>
<text x="1105" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• locker shelf visibility</text>
<text x="1105" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• chair scale</text>
<text x="1105" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• chamber head clearance</text>
<text x="1105" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• ceiling density</text>
<text x="1105" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1105" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Keep critical interaction controls</text>
<text x="1105" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">roughly 0.9–1.5 m above floor unless</text>
<text x="1105" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">the fiction requires otherwise.</text>
<text x="1105" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1105" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Small detail above 2.2 m should be</text>
<text x="1105" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">architectural rhythm, not important lore.</text>
<text x="1105" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1105" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Never approve a prop only from</text>
<text x="1105" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">orthographic or editor perspective.</text><text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text></svg>