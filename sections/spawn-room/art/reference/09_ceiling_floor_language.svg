<text x="125" y="674" fill="#b8c5c3" font-family="Arial" font-size="16">One replacement tile, route wear, threshold strips. No cracks everywhere.</text><rect x="1050" y="140" width="490" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1070" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">SURFACE RHYTHM</text><text x="1075" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Ceiling</text>
<text x="1075" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• repeated practical-light rhythm</text>
<text x="1075" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one broad duct or utility run</text>
<text x="1075" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• occasional service panel</text>
<text x="1075" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one sprinkler / safety fixture family</text>
<text x="1075" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• avoid overhead pipe spaghetti</text>
<text x="1075" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1075" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Floor</text>
<text x="1075" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• large institutional tiles/panels</text>
<text x="1075" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• subtle unit-to-unit variation</text>
<text x="1075" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• localized route wear</text>
<text x="1075" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1–2 replacement panels</text>
<text x="1075" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• rubber thresholds</text>
<text x="1075" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• optional service cover / drain</text>
<text x="1075" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1075" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Visual rule</text>
<text x="1075" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Ceiling carries building rhythm.</text>
<text x="1075" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Floor carries movement history.</text>
<text x="1075" y="671" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Walls carry hierarchy and navigation.</text>
