<rect x="24" y="24" width="1552" height="852" rx="18" fill="none" stroke="#30464a" stroke-width="2"/>
<text x="58" y="72" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">SPAWN HALLWAY</text>
<text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">EDGE-DRESSED, CENTER-CLEAR, INSTITUTIONAL AND HUMAN</text>
<rect x="52" y="140" width="1020" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="72" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">HALLWAY — FUNCTIONAL COMPOSITION</text><rect x="90" y="190" width="940" height="520" fill="#202d2f"/>
<polygon points="130,665 990,665 860,370 280,370" fill="#535c5c"/>
<rect x="280" y="230" width="580" height="140" fill="#c8c4b8"/>
<rect x="170" y="285" width="150" height="280" fill="#334f4d"/><text x="200" y="440" fill="#f0eee5" font-family="Arial" font-size="22">BRIEFING</text>
<rect x="800" y="285" width="150" height="280" fill="#334f4d"/><text x="830" y="440" fill="#f0eee5" font-family="Arial" font-size="22">LOCKERS</text>
<rect x="475" y="280" width="170" height="290" fill="#d2a32f"/><rect x="505" y="310" width="110" height="205" fill="#293638"/>
<rect x="355" y="420" width="120" height="18" fill="#704f32"/><rect x="375" y="438" width="12" height="65" fill="#394344"/><rect x="445" y="438" width="12" height="65" fill="#394344"/>
<rect x="650" y="380" width="70" height="110" fill="#314747"/><circle cx="685" cy="410" r="10" fill="#d9aa38"/>
<rect x="390" y="245" width="315" height="14" fill="#f7edca"/>
<text x="110" y="695" fill="#b8c5c3" font-family="Arial" font-size="16">Keep the spawn floor free. Dress edges, not the exact four-player gather zone.</text><rect x="1100" y="140" width="440" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1120" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">HALLWAY DETAIL RULES</text><text x="1125" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Architecture</text>
<text x="1125" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 3.0–3.4 m clear width</text>
<text x="1125" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 3.2–3.8 m ceiling</text>
<text x="1125" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• deep door reveals</text>
<text x="1125" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• utilities continue beyond room</text>
<text x="1125" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1125" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Dressing</text>
<text x="1125" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1 modest bench OR linked seats</text>
<text x="1125" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1 grouped notice area</text>
<text x="1125" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 1 utility cabinet / bin cluster</text>
<text x="1125" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 2–4 portraits across whole section</text>
<text x="1125" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 0–1 plant in hallway, only if justified</text>
<text x="1125" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1125" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Negative space</text>
<text x="1125" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• keep 35–50% of visible wall quiet</text>
<text x="1125" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• no object every metre</text>
<text x="1125" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• no symmetric prop mirroring</text>
<text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text>
</svg>