<text x="115" y="655" fill="#b8c5c3" font-family="Arial" font-size="16">Four usable seats, slightly misaligned. Screen is built into the facility, not a luxury TV.</text><rect x="1080" y="140" width="460" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1100" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">BRIEFING CHECKLIST</text><text x="1105" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Required</text>
