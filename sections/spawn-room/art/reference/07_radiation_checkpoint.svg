<path d="M380 370 A50 50 0 0 1 490 370" fill="none" stroke="#314d4c" stroke-width="5"/><line x1="435" y1="370" x2="412" y2="325" stroke="#d4a22e" stroke-width="6"/>
<circle cx="520" cy="460" r="25" fill="#d4a22e"/><rect x="340" y="430" width="100" height="18" fill="#394747"/><rect x="340" y="460" width="100" height="18" fill="#394747"/>
<path d="M390 535 l18 -32 l18 32 z" fill="#d4a22e"/>
<line x1="590" y1="320" x2="720" y2="280" stroke="#d9aa38" stroke-width="2"/><text x="735" y="286" fill="#223033" font-family="Arial" font-size="16">Analog / simple digital readout</text>
<line x1="590" y1="455" x2="720" y2="445" stroke="#d9aa38" stroke-width="2"/><text x="735" y="451" fill="#223033" font-family="Arial" font-size="16">Physical test / reset control</text>
<line x1="590" y1="540" x2="720" y2="560" stroke="#d9aa38" stroke-width="2"/><text x="735" y="566" fill="#223033" font-family="Arial" font-size="16">Small functional hazard mark</text><rect x="980" y="140" width="560" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="1000" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">CHECKPOINT RULES</text><text x="1005" y="185" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Wall unit target</text>
<text x="1005" y="212" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 0.45–0.70 m wide</text>
<text x="1005" y="239" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• 0.25–0.40 m deep</text>
<text x="1005" y="266" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• mounted around chest/eye level</text>
<text x="1005" y="293" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• readable from 2–4 m</text>
<text x="1005" y="320" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1005" y="347" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Use</text>
<text x="1005" y="374" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one gauge / readout</text>
<text x="1005" y="401" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one physical control</text>
<text x="1005" y="428" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one speaker/grille</text>
<text x="1005" y="455" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one sensor/probe zone</text>
<text x="1005" y="482" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• one compact status lamp</text>
<text x="1005" y="509" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1005" y="536" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Avoid</text>
<text x="1005" y="563" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• giant freestanding kiosk</text>
<text x="1005" y="590" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• screen bigger than the machine</text>
<text x="1005" y="617" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• decorative radiation icon repeated 5×</text>
<text x="1005" y="644" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• glowing sci-fi panel lines</text>
<text x="1005" y="671" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">• floating wall mount</text>
<text x="1005" y="698" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400"></text>
<text x="1005" y="725" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">At gameplay distance the silhouette should say</text>
<text x="1005" y="752" fill="#dce4e2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">“industrial meter,” before any text is read.</text>
<text x="58" y="852" fill="#87999b" font-family="Arial,Helvetica,sans-serif" font-size="14">CRITICAL SHIFT — SPAWN ROOM REFERENCE — BELIEVABLE FIRST • STYLIZED SECOND • READABLE ALWAYS</text>
</svg>