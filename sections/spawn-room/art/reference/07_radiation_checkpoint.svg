<text x="58" y="106" fill="#d9aa38" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">SMALL, FUNCTIONAL, WALL-MOUNTED, READABLE</text>
<rect x="52" y="140" width="900" height="610" rx="12" fill="#111d20" stroke="#2f4549"/><text x="72" y="174" fill="#f2f1e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">RADIATION / DOSE CHECKPOINT</text><rect x="100" y="190" width="790" height="490" fill="#c6c3b8"/>
