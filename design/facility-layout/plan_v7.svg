<text x="782.4" y="585.0" text-anchor="start" font-size="8" fill="#555">locked link</text><rect x="885" y="75" width="500" height="810" fill="#fff" stroke="#bbb"/><text x="901" y="100" font-size="15" font-weight="700" fill="#1d6b3a">Travel times along this plan</text><text x="901" y="117" font-size="10.5" fill="#666">Walking 4.5 m/s, loaded cart 1.5 m/s (spec assumptions), straight-line connectors.</text><text x="901" y="140" font-size="11.5" fill="#222">Spawn door to mine door</text><text x="1245" y="140" font-size="11.5" fill="#222" text-anchor="end">74 m</text><text x="1379" y="140" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">16 s walk</text><text x="901" y="160" font-size="11.5" fill="#222">Mine door to refinery freight door</text><text x="1245" y="160" font-size="11.5" fill="#222" text-anchor="end">45 m</text><text x="1379" y="160" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">30 s cart</text><text x="901" y="180" font-size="11.5" fill="#222">Refinery fuel door to reactor (cart)</text><text x="1245" y="180" font-size="11.5" fill="#222" text-anchor="end">41 m</text><text x="1379" y="180" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">27 s cart</text><text x="901" y="200" font-size="11.5" fill="#222">Hall to reactor (spine)</text><text x="1245" y="200" font-size="11.5" fill="#222" text-anchor="end">34 m</text><text x="1379" y="200" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">8 s walk</text><text x="901" y="220" font-size="11.5" fill="#222">Spawn door to reactor</text><text x="1245" y="220" font-size="11.5" fill="#222" text-anchor="end">79 m</text><text x="1379" y="220" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">18 s walk</text><text x="901" y="240" font-size="11.5" fill="#222">Medical to reactor</text><text x="1245" y="240" font-size="11.5" fill="#222" text-anchor="end">88 m</text><text x="1379" y="240" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">20 s walk</text><text x="901" y="260" font-size="11.5" fill="#222">Reactor to turbine</text><text x="1245" y="260" font-size="11.5" fill="#222" text-anchor="end">3 m</text><text x="1379" y="260" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">1 s walk</text><text x="901" y="280" font-size="11.5" fill="#222">Reactor to electrical</text><text x="1245" y="280" font-size="11.5" fill="#222" text-anchor="end">15 m</text><text x="1379" y="280" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">3 s walk</text><text x="901" y="300" font-size="11.5" fill="#222">Reactor to waste</text><text x="1245" y="300" font-size="11.5" fill="#222" text-anchor="end">23 m</text><text x="1379" y="300" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">5 s walk</text><text x="901" y="320" font-size="11.5" fill="#222">Reactor to cooling</text><text x="1245" y="320" font-size="11.5" fill="#222" text-anchor="end">36 m</text><text x="1379" y="320" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">8 s walk</text><text x="901" y="340" font-size="11.5" fill="#222">Mine-water pipe length</text><text x="1245" y="340" font-size="11.5" fill="#222" text-anchor="end">37 m</text><text x="1379" y="340" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">8 s walk</text><text x="901" y="360" font-size="11.5" fill="#222">Spawn door to cooling (new yard link)</text><text x="1245" y="360" font-size="11.5" fill="#222" text-anchor="end">104 m</text><text x="1379" y="360" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">23 s walk</text><text x="901" y="380" font-size="11.5" fill="#222">Spawn door to electrical (now farthest)</text><text x="1245" y="380" font-size="11.5" fill="#222" text-anchor="end">121 m</text><text x="1379" y="380" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">27 s walk</text><text x="901" y="400" font-size="11.5" fill="#222">Cooling to electrical, round the ring</text><text x="1245" y="400" font-size="11.5" fill="#222" text-anchor="end">117 m</text><text x="1379" y="400" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">26 s walk</text><text x="901" y="420" font-size="11.5" fill="#222">Cooling to electrical, through the reactor</text><text x="1245" y="420" font-size="11.5" fill="#222" text-anchor="end">81 m</text><text x="1379" y="420" font-size="11.5" font-weight="700" fill="#222" text-anchor="end">18 s walk</text><text x="901" y="454" font-size="14" font-weight="700" fill="#8a2d1a">What the measurements changed</text><text x="901" y="474" font-size="11.5" fill="#222">Measured in Blender (outer size incl. sills, roofs, annexes):</text><text x="901" y="490.5" font-size="11.5" fill="#222">- Reactor 27.5 x 27.5 m (+ 6.5 m east annex): I had 29 x 29.</text><text x="901" y="507.0" font-size="11.5" fill="#222">- Spawn 17.4 x 13.4 m: I had 14 x 28. It is wide and shallow.</text><text x="901" y="523.5" font-size="11.5" fill="#222">- Dock 14.2 x 18.2 m shell (18.7 x 15.8 m laid out sideways).</text><text x="901" y="540.0" font-size="11.5" fill="#222">- Refinery 14.8 x 17.6, electrical 15.4 x 17.2 (incl. reserve),</text><text x="901" y="556.5" font-size="11.5" fill="#222">  waste 14.9 x 20.8, cooling 12.9 x 15, medical 13 x 9.8.</text><text x="901" y="573.0" font-size="11.5" fill="#222">- Fuel corridor envelope 23.1 x 24 m: matches the 38 m L path.</text><text x="901" y="589.5" font-size="11.5" fill="#222">Outer sizes are bigger than the contract interior sizes I used</text><text x="901" y="606.0" font-size="11.5" fill="#222">before (e.g. waste 12 x 18 inside, 14.9 x 20.8 outside).</text><text x="901" y="622.5" font-size="11.5" fill="#222"></text><text x="901" y="639.0" font-size="11.5" fill="#222">Effect on the plan:</text><text x="901" y="655.5" font-size="11.5" fill="#222">- Spawn column is shorter, so the front end is less tall.</text><text x="901" y="672.0" font-size="11.5" fill="#222">- Fuel connector at the reactor is now 2.7 m (corridor sill</text><text x="901" y="688.5" font-size="11.5" fill="#222">  fixes the start), so fuel run stays ~27 s loaded.</text><text x="901" y="705.0" font-size="11.5" fill="#222">- Nothing overlaps; the east trunk and waste still fit.</text><text x="901" y="721.5" font-size="11.5" fill="#222"></text><text x="901" y="738.0" font-size="11.5" fill="#222">Still proposals: cafeteria, hall, yard (no source sizes).</text><text x="901" y="754.5" font-size="11.5" fill="#222">Not built, not saved in the repo.</text></svg>