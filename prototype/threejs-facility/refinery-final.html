<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Critical Shift — Final Refinery Facility</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1114;color:#dff9ff;font-family:system-ui,sans-serif;overflow:hidden}body{display:grid;place-items:center}.load{max-width:520px;padding:24px;text-align:center}.load strong{display:block;letter-spacing:.12em;margin-bottom:8px}.load small{color:#9ab5bc;line-height:1.45}pre{white-space:pre-wrap;text-align:left;color:#ffb7b7;background:#160e10;padding:18px;border-radius:8px;max-width:min(760px,88vw);overflow:auto}
</style>
</head>
<body>
<div class="load"><strong>REFINERY FACILITY R-17B</strong><small>Loading final facility…</small></div>
<script>
(async()=>{
  const COMMIT='28750bdeea515abc78f74138ef00d53b2d856276';
  const BASE=`https://rawcdn.githack.com/CameronNel/critical-shift/${COMMIT}/prototype/threejs-facility/final-payload/`;
  const files=['part-01.txt','part-02.txt','part-03.txt','part-04a.txt','part-04b.txt'];
  const parts=await Promise.all(files.map(async name=>{
    const r=await fetch(BASE+name,{cache:'force-cache'});
    if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);
    return (await r.text()).trim();
  }));

  function decodeBase64(source){
    const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const clean=source.replace(/\s+/g,'').replace(/=+$/,'');
    const out=[];let buffer=0,bits=0;
    for(const ch of clean){
      const value=alphabet.indexOf(ch);
      if(value<0)throw new Error(`Invalid payload character: ${JSON.stringify(ch)}`);
      buffer=(buffer<<6)|value;bits+=6;
      while(bits>=8){bits-=8;out.push((buffer>>bits)&255);buffer&=(1<<bits)-1;}
    }
    return new Uint8Array(out);
  }

  const compressed=decodeBase64(parts.join(''));
  if(compressed[0]!==0x1f||compressed[1]!==0x8b)throw new Error('Final facility payload failed gzip validation.');
  if(typeof DecompressionStream!=='function')throw new Error('This browser does not support DecompressionStream. Open the downloadable plain HTML instead.');
  const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if(!html.includes('REFINERY FACILITY R-17B · FINAL'))throw new Error('Decoded facility failed identity validation.');
  document.open();document.write(html);document.close();
})().catch(err=>{
  document.body.innerHTML=`<pre>${String(err.stack||err).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>`;
});
</script>
</body>
</html>
