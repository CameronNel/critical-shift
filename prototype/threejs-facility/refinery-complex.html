<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Critical Shift — Compact Refinery</title><body style="margin:0;background:#090d10;color:#dff9ff;font-family:system-ui;display:grid;place-items:center;height:100vh"><div>Loading compact refinery…</div><script>
(async()=>{
const PREVIOUS='https://raw.githubusercontent.com/CameronNel/critical-shift/0164b3a851ec18efb389b554ad258661b08973e4/prototype/threejs-facility/refinery-complex.html';
let outer=await fetch(PREVIOUS,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('source '+r.status);return r.text()});
const marker='document.open();document.write(html);document.close();';
const patch=String.raw`
// Compact refinery pass: 108x54 authored layout -> ~69x35 gameplay footprint.
html=html.replace("const scene=new THREE.Scene();","const COMPACT=.64; const scene=new THREE.Scene(); scene.scale.set(COMPACT,1,COMPACT);");
html=html.replace("scene.fog=new THREE.Fog(0x10171b,65,155);","scene.fog=new THREE.Fog(0x10171b,46,105);");
html=html.replace("const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,240);","const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,170);");
html=html.replace("function solid(x1,x2,z1,z2,y1=0,y2=8){solids.push({x1,x2,z1,z2,y1,y2});}","function solid(x1,x2,z1,z2,y1=0,y2=8){solids.push({x1:x1*COMPACT,x2:x2*COMPACT,z1:z1*COMPACT,z2:z2*COMPACT,y1,y2});}");
html=html.replace("function interactive(pos,radius,text,action){interactions.push({pos:new THREE.Vector3(...pos),radius,text,action});}","function interactive(pos,radius,text,action){interactions.push({pos:new THREE.Vector3(pos[0]*COMPACT,pos[1],pos[2]*COMPACT),radius,text,action});}");
html=html.replaceAll("camera.position.set(-49,EYE,19)","camera.position.set(-49*COMPACT,EYE,19*COMPACT)");
html=html.replace("function groundSurface(x,z,currentFeet){\n  let g=0;","function groundSurface(x,z,currentFeet){\n  x/=COMPACT; z/=COMPACT;\n  let g=0;");
html=html.replace("const zones=[{x:-36,n:'01 / ORE RECEIVING'},{x:-20,n:'02 / PRIMARY CRUSHING'},{x:-4,n:'03 / SPECTRAL SORTING'},{x:14,n:'04 / PRESSURE PROCESS'},{x:30,n:'05 / ROTARY DRYING'},{x:45,n:'06 / FUEL FABRICATION'},{x:999,n:'07 / FINAL INSPECTION'}];","const zones=[{x:-36*COMPACT,n:'01 / ORE RECEIVING'},{x:-20*COMPACT,n:'02 / PRIMARY CRUSHING'},{x:-4*COMPACT,n:'03 / SPECTRAL SORTING'},{x:14*COMPACT,n:'04 / PRESSURE PROCESS'},{x:30*COMPACT,n:'05 / ROTARY DRYING'},{x:45*COMPACT,n:'06 / FUEL FABRICATION'},{x:999,n:'07 / FINAL INSPECTION'}];");
html=html.replace("camera.position.x=Math.max(-53.0,Math.min(53.0,camera.position.x));camera.position.z=Math.max(-25.7,Math.min(25.7,camera.position.z));","camera.position.x=Math.max(-53.0*COMPACT,Math.min(53.0*COMPACT,camera.position.x));camera.position.z=Math.max(-25.7*COMPACT,Math.min(25.7*COMPACT,camera.position.z));");
html=html.replace("footprint:'108m x 54m'","footprint:'69m x 35m compact pass'");
html=html.replace("A focused full-chain refinery built around readable multiplayer circulation","A compact full-chain refinery built around readable multiplayer circulation");
html=html.replace("Full processing chain · bright 1990s industrial sci-fi · focused multiplayer routes","Compact full processing chain · bright 1990s industrial sci-fi · tight multiplayer routes");
`;
if(!outer.includes(marker))throw Error('compact injection marker missing');
outer=outer.replace(marker,patch+marker);
document.open();document.write(outer);document.close();
})().catch(e=>document.body.innerHTML='<pre style="padding:20px;white-space:pre-wrap">Failed to load compact refinery: '+e+'</pre>');
</script>
