<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Critical Shift — Refinery Complex Walkthrough</title><body style="margin:0;background:#090d10;color:#dff9ff;font-family:system-ui;display:grid;place-items:center;height:100vh"><div id="loading">Loading refinery complex…</div><script>
(async()=>{
const SOURCE='https://raw.githack.com/CameronNel/critical-shift/4ab15905faa5aa75925095337dcd88daa1d55d0e/prototype/threejs-facility/refinery-complex.html';
const outer=await fetch(SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('source '+r.status);return r.text()});
const m=outer.match(/const b64=`([^`]+)`/);if(!m)throw Error('refinery payload missing');
const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));

const touch=matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0||new URLSearchParams(location.search).has('mobile');
if(touch){
const css=`#mobileControls{display:block;position:fixed;inset:0;z-index:20;pointer-events:none;touch-action:none}#lookPad{position:absolute;right:0;top:0;width:58vw;height:100%;pointer-events:auto;touch-action:none}#movePad{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:1px solid rgba(197,236,244,.32);background:rgba(13,25,29,.38);box-shadow:inset 0 0 0 18px rgba(255,255,255,.018);pointer-events:auto;touch-action:none;backdrop-filter:blur(4px)}#moveKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:1px solid rgba(202,244,250,.58);background:rgba(129,215,229,.22);box-shadow:0 5px 16px rgba(0,0,0,.28)}.mobileButton{position:absolute;width:66px;height:66px;border-radius:50%;border:1px solid rgba(203,240,246,.42);background:rgba(10,20,24,.68);color:#eafcff;font:800 10px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;pointer-events:auto;touch-action:none;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}.mobileButton:active,.mobileButton.active{background:rgba(114,213,230,.36);border-color:#9cebf6}#mobileInteract{right:max(20px,env(safe-area-inset-right));bottom:max(116px,calc(env(safe-area-inset-bottom) + 116px))}#mobileJump{right:max(94px,calc(env(safe-area-inset-right) + 94px));bottom:max(38px,calc(env(safe-area-inset-bottom) + 38px))}#mobileSprint{right:max(18px,env(safe-area-inset-right));bottom:max(34px,calc(env(safe-area-inset-bottom) + 34px));width:58px;height:58px}#mobileReset{right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));width:48px;height:48px;font-size:9px}#touchHint{position:absolute;left:50%;bottom:max(172px,calc(env(safe-area-inset-bottom) + 172px));transform:translateX(-50%);font-size:10px;letter-spacing:.08em;color:rgba(221,246,251,.65);text-shadow:0 1px 5px #000;white-space:nowrap}#controls,#flow{display:none!important}#titleCard{left:10px!important;top:max(10px,env(safe-area-inset-top))!important;width:min(310px,calc(100vw - 78px))!important;padding:10px 12px!important}#titleCard p{display:none}#zone{margin-top:5px!important;font-size:10px!important}.startbox{padding:20px!important}.startbox h2{font-size:25px!important}.startbox p{font-size:13px!important}.startbox button{min-height:48px;width:100%}#prompt{top:65%!important;font-size:11px!important;max-width:54vw;text-align:center}@media(max-width:420px){#movePad{width:116px;height:116px}#touchHint{display:none}.mobileButton{width:60px;height:60px}#mobileJump{right:84px}}`;

const mobile=`<div id="mobileControls" aria-label="Mobile walkthrough controls"><div id="lookPad" aria-hidden="true"></div><div id="movePad" aria-label="Movement joystick"><div id="moveKnob"></div></div><button id="mobileInteract" class="mobileButton">Use</button><button id="mobileJump" class="mobileButton">Jump</button><button id="mobileSprint" class="mobileButton">Run</button><button id="mobileReset" class="mobileButton">Reset</button><div id="touchHint">LEFT STICK MOVE · DRAG RIGHT SIDE TO LOOK</div></div>`;

const control=`let mobileActive=false,mobileSprint=false,moveInputX=0,moveInputY=0,movePointer=null,lookPointer=null,lookLastX=0,lookLastY=0;function resetPlayer(){camera.position.set(-49,EYE,19);velocity.set(0,0,0);yaw=-Math.PI/2;pitch=0;setCameraRotation()}enter.textContent='Enter mobile walkthrough';enter.addEventListener('click',()=>{mobileActive=true;start.classList.add('hidden')});document.addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE')useNearest();if(e.code==='KeyR')resetPlayer()});document.addEventListener('keyup',e=>keys.delete(e.code));const movePad=document.getElementById('movePad'),moveKnob=document.getElementById('moveKnob'),lookPad=document.getElementById('lookPad'),mobileInteract=document.getElementById('mobileInteract'),mobileJump=document.getElementById('mobileJump'),mobileSprintButton=document.getElementById('mobileSprint'),mobileReset=document.getElementById('mobileReset');function movePoint(e){const r=movePad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}moveInputX=dx/max;moveInputY=dy/max;moveKnob.style.transform='translate('+dx+'px,'+dy+'px)'}function clearMove(){movePointer=null;moveInputX=moveInputY=0;moveKnob.style.transform='translate(0,0)'}movePad.addEventListener('pointerdown',e=>{movePointer=e.pointerId;movePad.setPointerCapture(e.pointerId);movePoint(e);e.preventDefault()});movePad.addEventListener('pointermove',e=>{if(e.pointerId===movePointer){movePoint(e);e.preventDefault()}});movePad.addEventListener('pointerup',e=>{if(e.pointerId===movePointer)clearMove()});movePad.addEventListener('pointercancel',clearMove);lookPad.addEventListener('pointerdown',e=>{if(!mobileActive)return;lookPointer=e.pointerId;lookLastX=e.clientX;lookLastY=e.clientY;lookPad.setPointerCapture(e.pointerId);e.preventDefault()});lookPad.addEventListener('pointermove',e=>{if(e.pointerId!==lookPointer)return;const dx=e.clientX-lookLastX,dy=e.clientY-lookLastY;lookLastX=e.clientX;lookLastY=e.clientY;yaw-=dx*.0052;pitch-=dy*.0048;pitch=Math.max(-1.42,Math.min(1.42,pitch));setCameraRotation();e.preventDefault()});lookPad.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null});lookPad.addEventListener('pointercancel',()=>lookPointer=null);mobileInteract.addEventListener('pointerdown',e=>{if(mobileActive)useNearest();e.preventDefault()});mobileJump.addEventListener('pointerdown',e=>{if(mobileActive&&onGround){velocity.y=6.4;onGround=false}e.preventDefault()});mobileSprintButton.addEventListener('pointerdown',e=>{mobileSprint=true;mobileSprintButton.classList.add('active');mobileSprintButton.setPointerCapture(e.pointerId);e.preventDefault()});const stopSprint=()=>{mobileSprint=false;mobileSprintButton.classList.remove('active')};mobileSprintButton.addEventListener('pointerup',stopSprint);mobileSprintButton.addEventListener('pointercancel',stopSprint);mobileReset.addEventListener('pointerdown',e=>{resetPlayer();e.preventDefault()});document.addEventListener('contextmenu',e=>e.preventDefault());`;
html=html.replace(/enter\.addEventListener\('click'[\s\S]*?document\.addEventListener\('keyup',e=>keys\.delete\(e\.code\)\);/,control);
html=html.replace("prompt.textContent=it?`E  ${it.text}`:'';","prompt.textContent=it?`USE  ${it.text}`:'';");
html=html.replace('const locked=document.pointerLockElement===renderer.domElement;\n  if(locked){','const locked=document.pointerLockElement===renderer.domElement;\n  const active=locked||mobileActive;\n  if(active){');
html=html.replace("if(keys.has('KeyW'))wish.add(f);if(keys.has('KeyS'))wish.sub(f);if(keys.has('KeyD'))wish.add(r);if(keys.has('KeyA'))wish.sub(r);\n    const speed=keys.has('ShiftLeft')||keys.has('ShiftRight')?8.2:5.2;","if(keys.has('KeyW'))wish.add(f);if(keys.has('KeyS'))wish.sub(f);if(keys.has('KeyD'))wish.add(r);if(keys.has('KeyA'))wish.sub(r);wish.addScaledVector(f,-moveInputY);wish.addScaledVector(r,moveInputX);\n    const speed=(keys.has('ShiftLeft')||keys.has('ShiftRight')||mobileSprint)?8.2:5.2;");
}
document.open();document.write(html);document.close();
})().catch(e=>document.body.innerHTML='<pre style="padding:20px;white-space:pre-wrap">Failed to load refinery: '+e+'</pre>');
