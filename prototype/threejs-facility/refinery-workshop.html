<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Critical Shift — Refinery Operations Pass</title>
<body style="margin:0;background:#0e1417;color:#dff9ff;font-family:system-ui;display:grid;place-items:center;height:100vh">
<div>Loading refinery operations pass…</div>
<script>
(async()=>{
  const SOURCE='https://raw.githubusercontent.com/CameronNel/critical-shift/f4d283fb24da34d717264a24852610aef2957d23/prototype/threejs-facility/refinery-workshop.html';
  let outer=await fetch(SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('source '+r.status);return r.text()});
  const needle="const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));";
  const replacement="const cleaned=[...m[1]].filter(ch=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='.includes(ch)).join('');const padded=cleaned+'='.repeat((4-cleaned.length%4)%4);const bin=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));if(bin[0]!==31||bin[1]!==139)throw Error('decoded refinery payload is not gzip');";
  if(!outer.includes(needle)) throw Error('decoder patch target missing');
  outer=outer.replace(needle,replacement);
  document.open();document.write(outer);document.close();
})().catch(err=>{document.body.innerHTML='<pre style="padding:20px;color:#ffb7b7;background:#160e10;white-space:pre-wrap">'+String(err.stack||err)+'</pre>';});
</script>
