name: Deploy Gullet Mine to GitHub Pages

on:
  push:
    branches:
      - prototype/gullet-mine-work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gullet-mine-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: gullet-mine-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages and enable the site
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Gullet Mine artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/gullet-mine

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
