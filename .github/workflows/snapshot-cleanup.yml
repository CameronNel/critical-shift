name: Snapshot cleanup safety audit
on:
  push:
    branches: [chore/prune-generated-images-20260914]
    paths: ['.github/workflows/snapshot-cleanup.yml']
permissions:
  contents: read
concurrency:
  group: critical-shift-snapshot-cleanup
  cancel-in-progress: false
jobs:
  native-validation:
    if: github.ref == 'refs/heads/chore/prune-generated-images-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare exact deletion allowlist and preserve every retained input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot-cleanup-work
          cat > snapshot-cleanup-work/guard.py <<'PY'
          """Point-in-time, runner-only verification. Cannot publish repository changes."""
          from pathlib import Path
          import hashlib,json,os,re,subprocess,sys
          ROOT=Path.cwd().resolve()
          WORK=ROOT/'snapshot-cleanup-work'
          PREFIX='sections/facility-assembly/blender/'
          EXPECTED_SOURCE_HASH='938a5883b454642239c15bfb090bb9274bafb013b53e2bf6b8b54142a94c0b0b'
          ALLOW={
            'facility_master_A08_access.blend': '346209c437385f6ad2726f37992cab853ee5e7ce2fa4264a55eccf157b968150',
            'facility_master_A11_map_finish.blend': '7dd42cc72c7a3fdb46db9d66c6b1701e93b80b3c2bae9e98223a5582ee04a799',
            'facility_master_A12_complete.blend': '751f524666cc8837d0646b7e8544da582b3074f3b8958f86b9beeeaadb6d2f04',
            'facility_master_A13_roof_services.blend': '172cf77bc9f44fafc12909dc93c285b5199c6a01aa37fca861ec92fa18e8cef6',
            'facility_material_preview_A14.blend': '3a5a3d6a1fb8746581c7d04d67fa96ccaf6385512f3c98301fd2a240637f1beb',
          }
          EXT={'.png','.jpg','.jpeg','.webp','.tga','.tif','.tiff','.exr','.hdr','.bmp','.gif'}
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
              return h.hexdigest()
          def put(name,value): (WORK/name).write_text(json.dumps(value,indent=2)+'\n')
          def load(name): return json.loads((WORK/name).read_text())
          def prepare():
              require(os.environ.get('GITHUB_ACTIONS')=='true','Runner-only audit')
              require(os.environ.get('GITHUB_REF')=='refs/heads/chore/prune-generated-images-20260914','Wrong ref')
              require(not git('status','--porcelain','--untracked-files=no'),'Dirty tracked worktree')
              rows=[]
              for entry in subprocess.check_output(['git','ls-files','-s','-z']).decode().split('\0'):
                  if not entry:continue
                  metadata,name=entry.split('\t',1);mode,blob,stage=metadata.split()
                  require(stage=='0' and mode in {'100644','100755'},'Unsupported index entry '+name)
                  p=ROOT/name
                  with p.open('rb') as f:head=f.read(1024)
                  m=re.search(rb'^size (\d+)$',head,re.M) if head.startswith(b'version https://git-lfs.github.com/spec/v1') else None
                  oid=re.search(rb'^oid sha256:([0-9a-f]{64})$',head,re.M) if m else None
                  rows.append({'path':name,'blob':blob,'bytes':int(m.group(1)) if m else p.stat().st_size,'oid':oid.group(1).decode() if oid else None})
              bypath={r['path']:r for r in rows}
              selected=[]
              for name,expected in ALLOW.items():
                  r=bypath[PREFIX+name];require(r['oid']==expected,'Candidate changed: '+name);selected.append(r)
              sources={}
              for r in rows:
                  p=Path(r['path'])
                  if p.suffix.lower() in {'.py','.ps1','.sh','.yml','.yaml'} and not str(p).startswith('maintenance/') and str(p)!='.github/workflows/snapshot-cleanup.yml':
                      sources[str(p)]=(ROOT/p).read_text(encoding='utf-8-sig')
              h=hashlib.sha256()
              for p,t in sorted(sources.items()):h.update(p.encode()+b'\0'+t.encode()+b'\0')
              require(h.hexdigest()==EXPECTED_SOURCE_HASH,'Executable consumers changed since source audit')
              references=[]
              for r in selected:
                  hits=[]
                  for name,text in sources.items():
                      for i,line in enumerate(text.splitlines(),1):
                          if Path(r['path']).name.lower() in line.lower():hits.append({'file':name,'line':i,'text':line})
                  # These exact consumers were inspected as output writes, not input reads.
                  for hit in hits:
                      require('save_as_mainfile' in hit['text'] or (Path(r['path']).name=='facility_material_preview_A14.blend' and hit['text'].startswith('dest=')),'Unexpected non-output consumer: '+str(hit))
                  references.append({'path':r['path'],'executable_references':hits,'classification':'superseded output-only snapshot; no literal executable input consumer'})
              manifest=json.loads((ROOT/'MAP.json').read_text())
              scenes=[manifest['authoring_scene'],manifest['inspection_scene']]
              require(not set(scenes)&{r['path'] for r in selected},'Selected canonical scene')
              for p in ['MAP.json','open_map.py','OPEN_MAP.ps1','sections/facility-assembly/production/SOURCES.json','sections/facility-assembly/exteriors/CURRENT.json']:
                  text=(ROOT/p).read_text()
                  require(not any(name in text for name in ALLOW),'Active entrypoint/registry reference: '+p)
              images=[r for r in rows if Path(r['path']).suffix.lower() in EXT]
              inputs=[r for r in rows if r['path'] in scenes or re.match(r'^sections/facility-assembly/sources/[^/]+/module\.blend$',r['path']) or (r['path'].startswith('sections/facility-assembly/exteriors/') and r['path'].endswith('.blend'))]
              inputs += [r for r in images if '/assets/' in r['path'] or '/textures/' in r['path']]
              hydrate=[r for r in inputs if r['oid']]
              require(not {r['path'] for r in hydrate}&{r['path'] for r in selected},'Candidate in protected hydration set')
              print('SAFE_SELECTION',json.dumps({'files':len(selected),'bytes':sum(r['bytes'] for r in selected),'hydration_bytes':sum(r['bytes'] for r in hydrate),'retained_replay_inputs':['A14 authoring baseline','R15 authoring scene','R16 authoring scene','historical walkthrough/build inputs']}),flush=True)
              subprocess.run(['git','lfs','install','--local','--skip-smudge'],check=True)
              subprocess.run(['git','lfs','pull','--include='+','.join(r['path'] for r in hydrate),'--exclude='],check=True)
              for r in hydrate:require(sha(ROOT/r['path'])==r['oid'],'LFS hash mismatch: '+r['path'])
              state={'validated_commit':git('rev-parse','HEAD'),'base_main':'a82c7d9b80456153a0c65ca4897044a7f62c7d1c','rows':rows,'selected':selected,'scenes':scenes,'hydrate':hydrate,'retained_file_hashes':{r['path']:sha(ROOT/r['path']) for r in rows if r['path'] not in {x['path'] for x in selected}},'source_hash':h.hexdigest()}
              put('state.json',state);put('REFERENCES.json',references)
              (WORK/'scenes.txt').write_text('\n'.join(scenes)+'\n')
          def remove():
              state=load('state.json')
              before=[load('before-'+str(i)+'.json') for i in range(2)]
              previous=json.loads((ROOT/'maintenance/image-cleanup-20260914/DEPENDENCIES_AFTER.json').read_text())
              require(before==previous,'Fresh native reports differ from previous verified R17 baseline')
              for report in before:
                  require(not any(x['missing'] for x in report['libraries']),'Missing linked library')
                  require(len(report['libraries'])==24 and len(report['images'])==105,'Unexpected R17 graph')
                  text=json.dumps(report).lower()
                  require(not any(name.lower() in text for name in ALLOW),'Snapshot is a native dependency')
                  for im in report['images']:
                      require(im['packed'] or im['external_exists'] or im['source'] in {'VIEWER','GENERATED'},'Missing image')
              require(not git('diff','--name-only'),'Tracked content changed before removal')
              subprocess.run(['git','rm','--quiet','--',*[r['path'] for r in state['selected']]],check=True)
              print('REMOVED_IN_DISPOSABLE_RUNNER',len(state['selected']),flush=True)
          def verify():
              state=load('state.json');before=[load('before-'+str(i)+'.json') for i in range(2)];after=[load('after-'+str(i)+'.json') for i in range(2)]
              require(before==after,'Native dependency/geometry/image inventories changed')
              for name,expected in state['retained_file_hashes'].items():require(sha(ROOT/name)==expected,'Retained file changed: '+name)
              expected={'D\t'+r['path'] for r in state['selected']}
              require(set(git('diff','--cached','--name-status').splitlines())==expected,'Unexpected staged changes')
              require(not git('diff','--name-only'),'Unexpected unstaged changes')
              old=sum(r['bytes'] for r in state['rows']);removed=sum(r['bytes'] for r in state['selected'])
              report={'validated_commit':state['validated_commit'],'baseline_main_commit':state['base_main'],'removed_files':state['selected'],'removed_bytes':removed,'retained_blend_files':sum(r['path'].endswith('.blend') for r in state['rows'])-5,'retained_file_count':len(state['retained_file_hashes']),'all_retained_files_byte_identical':True,'executable_source_digest':state['source_hash'],'native_before_after_equal':True,'native_matches_previous_R17_audit':True,'hydrated_input_bytes':sum(r['bytes'] for r in state['hydrate']),'working_file_bytes_before':old,'working_file_bytes_after':old-removed,'scenes':[],'limitations':['No rendered visual, Unity or FPS test.','No repository publication by this read-only workflow.','No Git history rewrite or remote LFS quota reclamation.','Historical output reports may link to pruned snapshots; all build input snapshots were retained conservatively.']}
              for i,x in enumerate(before):report['scenes'].append({'path':x['scene'],'file_sha256':x['scene_sha256'],'geometry_digest':x['geometry_digest'],'objects':x['object_count'],'libraries':len(x['libraries']),'missing_libraries':sum(v['missing'] for v in x['libraries']),'images':len(x['images']),'packed_images':sum(len(v['packed']) for v in x['images']),'before_report_sha256':sha(WORK/('before-'+str(i)+'.json')),'after_report_sha256':sha(WORK/('after-'+str(i)+'.json'))})
              put('SUMMARY.json',report)
              print('NATIVE_CLEANUP_VERIFIED',json.dumps(report),flush=True)
          {'prepare':prepare,'remove':remove,'verify':verify}[sys.argv[1]]()
          PY
          python snapshot-cleanup-work/guard.py prepare
      - name: Install verified Blender toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
          mkdir -p "$RUNNER_TEMP/snapshot-blender"
          cd "$RUNNER_TEMP/snapshot-blender"
          V=5.2.1
          curl -fL --retry 2 --connect-timeout 25 --max-time 240 "https://download.blender.org/release/Blender5.2/blender-${V}-linux-x64.tar.xz" -o blender.tar.xz
          curl -fL --retry 2 --max-time 60 "https://download.blender.org/release/Blender5.2/blender-${V}.sha256" -o checksums
          EXPECTED=$(grep "blender-${V}-linux-x64.tar.xz" checksums | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  blender.tar.xz" | sha256sum --check -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/snapshot-blender/blender-${V}-linux-x64" >> "$GITHUB_PATH"
      - name: Cold-open both R17 maps before deletion
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r scene; do
            blender --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 1 --python tools/image-cleanup/blender_dependencies.py -- "$scene" "snapshot-cleanup-work/before-${i}.json" > "snapshot-cleanup-work/before-${i}.log" 2>&1
            grep SCENE_AUDIT "snapshot-cleanup-work/before-${i}.log"
            i=$((i+1))
          done < snapshot-cleanup-work/scenes.txt
      - name: Guarded removal in disposable checkout only
        run: python snapshot-cleanup-work/guard.py remove
      - name: Cold-open both R17 maps after deletion and compare every retained file
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r scene; do
            blender --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 1 --python tools/image-cleanup/blender_dependencies.py -- "$scene" "snapshot-cleanup-work/after-${i}.json" > "snapshot-cleanup-work/after-${i}.log" 2>&1
            grep SCENE_AUDIT "snapshot-cleanup-work/after-${i}.log"
            i=$((i+1))
          done < snapshot-cleanup-work/scenes.txt
          python snapshot-cleanup-work/guard.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: snapshot-native-verification
          path: snapshot-cleanup-work
          retention-days: 14
