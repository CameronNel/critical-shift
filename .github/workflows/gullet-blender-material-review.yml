name: Gullet Blender material review
on:
  push:
    branches: [art/gullet-material-repair-20260906]
    paths:
      - '.github/workflows/gullet-blender-material-review.yml'
      - 'sections/mine/blender/gullet/pbr/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gullet-blender-material-review
  cancel-in-progress: true
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install numpy Pillow scikit-image
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
      - name: Download and verify Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gullet-toolchain
          cd /tmp/gullet-toolchain
          V=5.2.1
          curl -fL --retry 2 --connect-timeout 25 --max-time 300 "https://download.blender.org/release/Blender5.2/blender-${V}-linux-x64.tar.xz" -o "blender-${V}-linux-x64.tar.xz"
          curl -fL --retry 2 --max-time 60 "https://download.blender.org/release/Blender5.2/blender-${V}.sha256" -o "blender-${V}.sha256"
          grep "blender-${V}-linux-x64.tar.xz" "blender-${V}.sha256" | sha256sum --check -
          tar -xf "blender-${V}-linux-x64.tar.xz"
          echo "/tmp/gullet-toolchain/blender-${V}-linux-x64" >> "$GITHUB_PATH"
          "./blender-${V}-linux-x64/blender" --background --factory-startup --python-expr "import bpy; print('VERIFIED_BLENDER', bpy.app.version_string)"
      - name: Download selected CC0 material packs
        run: |
          python sections/mine/blender/gullet/pbr/download_materials.py
          python sections/mine/blender/gullet/pbr/download_geology_detail.py
      - name: Build and render the actual mine
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          cd sections/mine/blender/gullet
          python tools/prepare_assets.py
          OUT="$GITHUB_WORKSPACE/sections/mine/production/material-review"
          mkdir -p "$OUT"
          blender --background --factory-startup --threads 4 --python-exit-code 1 --python build_mine.py -- --output "$OUT" --render entry,main_route,sump --samples 32 --width 1280 --device cpu 2>&1 | tee "$OUT/blender_build.log"
      - name: Cold-start checks in a new Blender process
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          cd sections/mine/blender/gullet
          OUT="$GITHUB_WORKSPACE/sections/mine/production/material-review"
          blender --background "$OUT/CriticalShift_Gullet_PBR.blend" --threads 4 --python-exit-code 1 --python pbr/validate_blender.py -- --output "$OUT/cold-start" --render entry --samples 16 --width 896 2>&1 | tee "$OUT/blender_cold_start.log"
      - name: Preserve actual scene, downloaded assets and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gullet-blender-material-review
          path: |
            sections/mine/production/material-review
            sections/mine/assets/pbr
          if-no-files-found: error
          retention-days: 14
      - name: Publish only section-local assets after successful checks
        if: success() && github.ref_name == 'art/gullet-material-repair-20260906'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=sections/mine
          mkdir -p "$ROOT/production/renders/review/cc0-materials" "$ROOT/production/checkpoints/cc0-materials"
          cp "$ROOT/production/material-review/CriticalShift_Gullet_PBR.blend" "$ROOT/blender/gullet/Gullet_MaterialReview.blend"
          cp "$ROOT/production/material-review/renders/"*.png "$ROOT/production/renders/review/cc0-materials/"
          cp "$ROOT/production/material-review/renders/render_report.json" "$ROOT/production/renders/review/cc0-materials/"
          cp "$ROOT/production/material-review/build_report.json" "$ROOT/production/checkpoints/cc0-materials/"
          cp "$ROOT/production/material-review/cold-start/cold_start_report.json" "$ROOT/production/checkpoints/cc0-materials/"
          cp "$ROOT/production/material-review/"*.log "$ROOT/production/checkpoints/cc0-materials/"
          git config user.name 'Critical Shift Asset Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/assets/pbr" "$ROOT/blender/gullet/Gullet_MaterialReview.blend" "$ROOT/production/renders/review/cc0-materials" "$ROOT/production/checkpoints/cc0-materials"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish CC0 mine materials, actual Blender scene and verified review evidence [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
