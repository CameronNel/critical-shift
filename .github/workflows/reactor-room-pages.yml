name: Deploy Standalone Reactor Room to GitHub Pages

on:
  push:
    branches:
      - feat/standalone-reactor-room
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: standalone-reactor-room-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: standalone-reactor-room-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages and enable the site
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload standalone reactor artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/reactor-room

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
