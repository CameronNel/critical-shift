name: WP-01 Unity environment preflight
on:
  push:
    branches: [feat/wp01-unity-foundation-20260917]
    paths: ['.github/workflows/unity-foundation-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect credentials presence and public toolchain metadata
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import os, json, platform, urllib.request, datetime
          from pathlib import Path
          present={k:bool(os.environ.get(k)) for k in ('UNITY_LICENSE','UNITY_EMAIL','UNITY_PASSWORD','UNITY_SERIAL')}
          report={'commit':os.environ['GITHUB_SHA'],'os':platform.platform(),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'credential_presence_only':present,'native_unity_status':'NotRun','reason':'Environment discovery only. No license values or account identifiers are recorded.'}
          Path('evidence/environment.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          for name,url in [('unity-release','https://services.api.unity.com/unity/editor/release/v1/releases?version=6000.4.3f1&limit=1'),('test-framework-registry','https://packages.unity.com/com.unity.test-framework')]:
              try:
                  with urllib.request.urlopen(url,timeout=60) as r:data=json.load(r)
                  Path('evidence/'+name+'.json').write_text(json.dumps(data,indent=2))
                  if name=='test-framework-registry':
                      print('TEST_FRAMEWORK_TAGS',data.get('dist-tags'))
                      print('TEST_FRAMEWORK_1_4_6',json.dumps(data.get('versions',{}).get('1.4.6',{})))
                      print('TEST_FRAMEWORK_1_6_0',json.dumps(data.get('versions',{}).get('1.6.0',{})))
                  else:print('UNITY_RELEASE',json.dumps(data))
              except Exception as e:
                  Path('evidence/'+name+'-error.txt').write_text(str(e))
                  print(name,type(e).__name__,str(e))
          PY
      - name: Retain non-sensitive prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp01-unity-environment
          path: evidence/
          retention-days: 14
          if-no-files-found: error
