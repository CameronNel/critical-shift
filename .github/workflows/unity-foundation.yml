name: WP-01 Unity foundation
on:
  push:
    branches: [feat/wp01-unity-foundation-20260917, main]
    paths: ['runtime/**', '.github/workflows/unity-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wp01-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            runtime
            .github/workflows
      - name: Static source integrity and negative-control tests
        run: |
          set -euo pipefail
          mkdir -p runtime/out/source
          python3 runtime/tools/check_source.py | tee runtime/out/source/static.json
          python3 -m unittest discover -s runtime/tools/tests -v >runtime/out/source/tool-tests.log 2>&1
          grep -E '^Ran |^OK|FAILED' runtime/out/source/tool-tests.log
          git diff --exit-code
      - name: Preserve source-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp01-source-checks-${{ github.run_id }}
          path: runtime/out/source/
          if-no-files-found: error
          retention-days: 14
  native-and-api:
    needs: source-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            runtime
            .github/workflows
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.423'
      - name: Install Linux Editor prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0t64 libnss3 libglu1-mesa libasound2t64 xvfb xauth
      - name: Fetch and verify the exact public toolchain
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p runtime/out/toolchain
          python3 runtime/tools/acquire_toolchain.py --root "$RUNNER_TEMP/unity-6000.4.3f1" --evidence runtime/out/toolchain | tee "$RUNNER_TEMP/toolchain-paths.txt"
          grep -E '^(EDITOR|NUNIT)=' "$RUNNER_TEMP/toolchain-paths.txt" >> "$GITHUB_ENV"
          echo "EDITOR_ROOT=$RUNNER_TEMP/unity-6000.4.3f1" >> "$GITHUB_ENV"
      - name: Compile five authored files against actual Unity reference assemblies
        id: api
        continue-on-error: true
        run: |
          python3 runtime/tools/api_compile.py --editor-root "$EDITOR_ROOT" --nunit "$NUNIT" --out runtime/out/api
      - name: Execute eight pure C# tests outside Unity
        id: pure
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p runtime/out/pure
          cd runtime/tools
          dotnet --version
          dotnet restore pure-tests/PureTests.csproj --locked-mode -p:NUnitAssembly="$NUNIT"
          dotnet run --project pure-tests/PureTests.csproj --no-restore -p:NUnitAssembly="$NUNIT" | tee ../out/pure/pure-tests.log
      - name: Native clean import, Unity suites, build and Player lifecycle
        id: native
        continue-on-error: true
        run: |
          set -euo pipefail
          xvfb-run -a python3 runtime/tools/run_foundation.py --unity "$EDITOR" --target Linux64 --out runtime/out/native
      - name: Record actual step outcomes and source preservation
        if: always()
        env:
          API_OUTCOME: ${{ steps.api.outcome }}
          PURE_OUTCOME: ${{ steps.pure.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          from pathlib import Path
          out=Path('runtime/out')
          out.mkdir(parents=True,exist_ok=True)
          diff=subprocess.run(['git','diff','--exit-code'],capture_output=True,text=True)
          report={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'toolchain':os.environ['TOOLCHAIN_OUTCOME'],'api_compile':os.environ['API_OUTCOME'],'pure_dotnet_tests':os.environ['PURE_OUTCOME'],'native':os.environ['NATIVE_OUTCOME'],'tracked_source_unchanged':diff.returncode==0,'gate':'Not accepted; independent review required even if runtime checks pass.'}
          (out/'job-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if diff.returncode:
              print(diff.stdout)
              raise SystemExit(1)
          PY
      - name: Preserve reports and logs, never vendor Editor binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp01-runtime-evidence-${{ github.run_id }}
          path: |
            runtime/out/toolchain/*.json
            runtime/out/api/*.log
            runtime/out/api/*.json
            runtime/out/pure/*.log
            runtime/out/job-summary.json
            runtime/out/native/*/report.json
            runtime/out/native/*/logs/*.log
            runtime/out/native/*/*.xml
          if-no-files-found: error
          retention-days: 14
      - name: Do not turn a skipped or blocked native check into a green gate
        if: always()
        env:
          API_OUTCOME: ${{ steps.api.outcome }}
          PURE_OUTCOME: ${{ steps.pure.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
        run: |
          test "$TOOLCHAIN_OUTCOME" = success
          test "$API_OUTCOME" = success
          test "$PURE_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success
