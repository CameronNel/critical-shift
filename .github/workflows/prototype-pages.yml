# Publishes only prototype/threejs-facility/ to GitHub Pages, so the level-design
# greybox can be opened from a phone. Delete this file together with that
# directory when the prototype is retired.
#
# Inert until Pages is enabled for the repository:
#   Settings -> Pages -> Source: GitHub Actions
# The workflow deliberately does not change that setting.
name: Prototype greybox to Pages

on:
  push:
    branches: [main]
    paths:
      - 'prototype/threejs-facility/**'
      - '.github/workflows/prototype-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prototype-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: prototype/threejs-facility

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/threejs-facility/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/threejs-facility/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
