name: Image cleanup dependency audit
on:
  push:
    branches: [chore/prune-generated-images-20260914]
    paths:
      - '.github/workflows/image-cleanup-audit.yml'
      - 'tools/image-cleanup/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: critical-shift-image-cleanup
  cancel-in-progress: false
jobs:
  verify-and-prune:
    if: github.ref == 'refs/heads/chore/prune-generated-images-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/prune-generated-images-20260914
          lfs: false
          fetch-depth: 1
      - name: Install read-only Blender inspection toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
          mkdir -p /tmp/image-cleanup-blender
          cd /tmp/image-cleanup-blender
          V=5.2.1
          curl -fL --retry 2 --connect-timeout 25 --max-time 300 "https://download.blender.org/release/Blender5.2/blender-${V}-linux-x64.tar.xz" -o blender.tar.xz
          curl -fL --retry 2 --max-time 60 "https://download.blender.org/release/Blender5.2/blender-${V}.sha256" -o checksums
          EXPECTED=$(grep "blender-${V}-linux-x64.tar.xz" checksums | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  blender.tar.xz" | sha256sum --check -
          tar -xf blender.tar.xz
          echo "/tmp/image-cleanup-blender/blender-${V}-linux-x64" >> "$GITHUB_PATH"
      - name: Select historical outputs and hydrate only map inputs
        run: python tools/image-cleanup/cleanup.py prepare
      - name: Cold-open both canonical scenes before any deletion
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r scene; do
            blender --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 1 --python tools/image-cleanup/blender_dependencies.py -- "$scene" "image-cleanup-work/before-${i}.json" > "image-cleanup-work/before-${i}.log" 2>&1
            grep SCENE_AUDIT "image-cleanup-work/before-${i}.log"
            i=$((i+1))
          done < image-cleanup-work/scenes.txt
      - name: Remove only candidates absent from the native dependency graph
        run: python tools/image-cleanup/cleanup.py apply
      - name: Cold-open both scenes again and verify unchanged dependencies
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r scene; do
            blender --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 1 --python tools/image-cleanup/blender_dependencies.py -- "$scene" "image-cleanup-work/after-${i}.json" > "image-cleanup-work/after-${i}.log" 2>&1
            grep SCENE_AUDIT "image-cleanup-work/after-${i}.log"
            i=$((i+1))
          done < image-cleanup-work/scenes.txt
          python tools/image-cleanup/cleanup.py verify
      - name: Publish verified deletions to task branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'chore/prune-generated-images-20260914'
          git config user.name 'Critical Shift Image Cleanup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove superseded review images after native map dependency verification [skip ci]'
          git push origin HEAD:refs/heads/chore/prune-generated-images-20260914
      - name: Preserve audit evidence and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-cleanup-native-validation
          path: |
            image-cleanup-work
            maintenance/image-cleanup-20260914
          retention-days: 14
