name: Mine exterior fixed-camera capture
on:
  push:
    branches: [art/mine-exterior-camera-match-20260914]
    paths: ['.github/workflows/mine-camera-match.yml', 'sections/facility-assembly/blender/capture_mine_fixed.py']
permissions:
  contents: read
concurrency:
  group: mine-exterior-camera-match
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: critical-shift-R17-mine-inputs-20260914-v1
      - name: Hydrate current full-map preview and linked inputs, not old snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mine-camera-output/context
          python - <<'PY'
          import json,pathlib,subprocess,hashlib,re
          root=pathlib.Path('.');manifest=json.loads((root/'MAP.json').read_text())
          paths=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          out=root/'mine-camera-output/context';texts={}
          for name in paths:
              p=root/name
              if p.suffix.lower() in {'.py','.json','.md','.txt','.pyfrag'} and (name.startswith('design/') or name.startswith('sections/facility-assembly/') or name.startswith('sections/mine/')) and p.stat().st_size<180000:
                  try:texts[name]=p.read_text(encoding='utf-8-sig')
                  except UnicodeError:pass
          (out/'source-context.json').write_text(json.dumps(texts));(out/'paths.json').write_text(json.dumps(paths,indent=2))
          wanted=[n for n in paths if n==manifest['inspection_scene'] or re.match(r'^sections/facility-assembly/sources/[^/]+/module\.blend$',n) or (n.startswith('sections/facility-assembly/exteriors/') and n.endswith('.blend')) or '/blender/textures/' in n]
          records=[]
          for n in wanted:
              h=(root/n).read_bytes()[:1024];m=re.search(rb'^oid sha256:([0-9a-f]{64})$',h,re.M);z=re.search(rb'^size (\d+)$',h,re.M)
              if m:records.append({'path':n,'sha256':m.group(1).decode(),'bytes':int(z.group(1))})
          (out/'INPUTS.json').write_text(json.dumps(records,indent=2))
          subprocess.run(['git','lfs','install','--local','--skip-smudge'],check=True)
          subprocess.run(['git','lfs','pull','--include='+','.join(wanted),'--exclude='],check=True)
          for r in records:assert hashlib.sha256((root/r['path']).read_bytes()).hexdigest()==r['sha256'],r['path']
          print('HYDRATED',len(records),sum(r['bytes'] for r in records),flush=True)
          PY
      - name: Install verified Blender CPU toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
          mkdir -p "$RUNNER_TEMP/mine-blender"
          cd "$RUNNER_TEMP/mine-blender"
          V=5.2.1
          curl -fL --retry 2 --connect-timeout 25 --max-time 240 "https://download.blender.org/release/Blender5.2/blender-${V}-linux-x64.tar.xz" -o blender.tar.xz
          curl -fL --retry 2 --max-time 60 "https://download.blender.org/release/Blender5.2/blender-${V}.sha256" -o checksums
          EXPECTED=$(grep "blender-${V}-linux-x64.tar.xz" checksums | awk '{print $1}')
          test -n "$EXPECTED"
          echo "$EXPECTED  blender.tar.xz" | sha256sum --check -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/mine-blender/blender-${V}-linux-x64" >> "$GITHUB_PATH"
      - name: Survey actual full scene and record camera transforms
        run: blender --background --factory-startup --disable-autoexec --threads 4 --python-exit-code 1 --python sections/facility-assembly/blender/capture_mine_fixed.py -- --survey-only > mine-camera-output/survey.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-mine-scene-survey
          path: mine-camera-output
          retention-days: 7
      - name: Render recorded cameras in unchanged full map
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --disable-autoexec --threads 4 --python-exit-code 1 --python sections/facility-assembly/blender/capture_mine_fixed.py > mine-camera-output/capture.log 2>&1
          grep -E 'FULL_MAP_OPENED|RENDER_START|RENDER_DONE' mine-camera-output/capture.log
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-mine-camera-baseline-cpu
          path: mine-camera-output
          retention-days: 7
