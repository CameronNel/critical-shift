name: Mine exterior geometry inspection
on:
  push:
    branches: [capture/mine-exterior-five-shots-20260916]
    paths:
      - '.github/workflows/mine-exterior-geometry-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mine-exterior-geometry-inspection-20260916
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      SOURCE_COMMIT: a82c7d9b80456153a0c65ca4897044a7f62c7d1c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Prepare virtual desktop and Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture-output /tmp/mine-inspection
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libopengl0 python3-pil
          cd /tmp/mine-inspection
          V=5.2.1
          curl -fsSL --retry 2 --max-time 180 "https://download.blender.org/release/Blender5.2/blender-${V}-linux-x64.tar.xz" -o blender.tar.xz
          curl -fsSL --retry 2 --max-time 60 "https://download.blender.org/release/Blender5.2/blender-${V}.sha256" -o blender.sha256
          EXPECTED=$(grep "blender-${V}-linux-x64.tar.xz" blender.sha256 | awk '{print $1}')
          echo "$EXPECTED  blender.tar.xz" | sha256sum --check -
          tar -xf blender.tar.xz
          echo "/tmp/mine-inspection/blender-${V}-linux-x64" >> "$GITHUB_PATH"
      - name: Hydrate canonical full-map dependencies
        shell: bash
        run: |
          set -euo pipefail
          SCENE=$(python3 -c "import json; print(json.load(open('MAP.json'))['inspection_scene'])")
          git lfs install --local
          git lfs pull --include="$SCENE,sections/facility-assembly/sources/**,sections/facility-assembly/exteriors/**,sections/facility-assembly/connections/**,sections/*/assets/**" --exclude=""
          git lfs fsck --pointers HEAD
          cp MAP.json capture-output/source_MAP.json
      - name: Capture actual material-color geometry inspection views
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tools/capture_mine_exterior.py').read_text()
          assert "space.shading.type = 'RENDERED'" in src
          src = src.replace("space.shading.type = 'RENDERED'", "space.shading.type = 'SOLID'\n            space.shading.light = 'STUDIO'\n            space.shading.color_type = 'MATERIAL'\n            space.shading.show_shadows = True\n            space.shading.show_cavity = True\n            space.shading.cavity_type = 'BOTH'\n            space.shading.show_specular_highlight = True")
          src = src.replace('return 30.0 if index == 0 else 12.0', 'return 5.0').replace('return 20.0 if index == 0 else 8.0', 'return 3.0')
          src = src.replace("report['method'] = 'Blender rendered 3D viewport screenshot'", "report['method'] = 'Blender solid material-color 3D viewport screenshot; studio inspection lighting, not authored rendered shading'")
          src = src.replace("write_report()\nbpy.app.timers.register", "report['note'] = 'Actual full-map geometry inspection screenshots using Blender SOLID material-color shading and studio lighting. The renders folder contains lossless viewport crops, not offline renders. Source scene never saved.'\nwrite_report()\nbpy.app.timers.register")
          compile(src, 'capture_geometry.py', 'exec')
          Path('/tmp/mine-inspection/capture_geometry.py').write_text(src)
          PY
          timeout 360s xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' blender --factory-startup --disable-autoexec --threads 4 -noaudio -p 0 0 1920 1080 --python-exit-code 1 --python /tmp/mine-inspection/capture_geometry.py 2>&1 | tee capture-output/blender_capture.log
      - name: Verify five distinct captured images and unchanged scene
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json, hashlib
          root=Path('capture-output')
          report=json.loads((root/'capture_manifest.json').read_text())
          assert report.get('completed'), report.get('error')
          assert report['source_sha256_before']==report['source_sha256_after']=='4d5d160d5c9d25b0a447fda933974790260cdde7aced2db1da1c908afdcdc937'
          for folder in ['screenshots','renders']:
              paths=list((root/folder).glob('*.png'))
              assert len(paths)==5
              assert len({hashlib.sha256(p.read_bytes()).hexdigest() for p in paths})==5
              for path in paths:
                  with Image.open(path) as image:
                      assert min(image.size)>=700
                      assert max(ImageStat.Stat(image.convert('RGB')).stddev)>2
                      print('VERIFIED_INSPECTION_SCREENSHOT',path,image.size)
          PY
      - name: Preserve geometry-inspection screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-shift-mine-exterior-solid-inspection
          path: capture-output/
          if-no-files-found: error
          retention-days: 14
