name: Editor-free runtime verification
on:
  push:
    branches: [feat/offline-reactor-power-20260918]
    paths: ['runtime/**', '.github/workflows/offline-runtime.yml']
  pull_request:
    paths: ['runtime/**', '.github/workflows/offline-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            runtime
            design/code-architecture
            .github/workflows
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Foundation static and Python checks only
        run: |
          python runtime/tools/check_source.py
          python -m unittest discover -s runtime/tools/tests -v
      - name: Offline gameplay verification
        working-directory: runtime/dotnet
        run: python tools/verify.py
      - name: Package the verified first-party scenario executable
        shell: bash
        run: |
          python - <<'PY_PACKAGE'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('runtime/dotnet')
          summary = json.loads((root/'artifacts/summary.json').read_text())
          assert summary['status'] == 'Passed'
          for name, digest in summary['source_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest, name
          names = ['CriticalShift.Application', 'CriticalShift.Scenarios'] + [
              'CriticalShift.Features.' + feature + '.Domain'
              for feature in ['Interaction', 'Session', 'Workers', 'Materials', 'Production', 'Reactor', 'Power']]
          folder = root/'tools/CriticalShift.Scenarios/bin/Release/net8.0'
          assert {p.stem for p in folder.glob('*.dll')} == set(names)
          files = [folder/(name+'.dll') for name in names] + [
              folder/'CriticalShift.Scenarios.runtimeconfig.json', folder/'CriticalShift.Scenarios.deps.json']
          files += sorted((root/'scenarios').glob('*.json'))
          contents = {(('scenarios/' if p.suffix == '.json' and p.parent.name == 'scenarios' else '') + p.name): p.read_bytes() for p in files}
          note = ('CRITICAL SHIFT: OFFLINE SCENARIO RUNNER\n'
                  'Requires the .NET 8 runtime. This is NOT a Unity Player or graphical game.\n'
                  'Run: dotnet CriticalShift.Scenarios.dll --scenario scenarios/reactor-cooling-recovery.json --report reports/new-run.json --repeat 2\n'
                  'Use a fresh report filename for each invocation; existing files are never overwritten.\n'
                  'All gameplay libraries are first-party outputs. No Unity, Blender, NUnit, font or licensed artwork is included.\n'
                  'Source and native-integration limitations are documented in runtime/README.md and runtime/dotnet/REACTOR_AND_POWER.md in the matching repository commit.\n')
          contents['README.txt'] = note.encode()
          manifest = {'tested_commit': summary['commit'], 'sdk': summary['sdk'], 'scope': 'Offline logical simulation only; native engine checks NotRun',
                      'files': {k: hashlib.sha256(v).hexdigest() for k,v in contents.items()}, 'source_sha256': summary['source_sha256']}
          contents['manifest.json'] = (json.dumps(manifest,indent=2)+'\n').encode()
          with zipfile.ZipFile(root/'artifacts/offline-scenario-runner.zip', 'x', zipfile.ZIP_DEFLATED) as z:
              for name,data in contents.items(): z.writestr(name,data)
          PY_PACKAGE
      - name: Preserve actual offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-runtime-${{ matrix.os }}-${{ github.run_id }}
          path: runtime/dotnet/artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Package exact first-party source inputs
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git archive --format=tar -o runtime-inputs.tar HEAD runtime design/code-architecture design/GAME_SPEC.md design/ENGINE_DECISION.md AGENTS.md README.md .github/workflows/offline-runtime.yml
      - name: Preserve source inputs
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-runtime-inputs-${{ github.run_id }}
          path: runtime-inputs.tar
          if-no-files-found: error
          retention-days: 30
