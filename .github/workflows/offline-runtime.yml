name: Editor-free runtime verification
on:
  push:
    branches: [feat/offline-reactor-power-20260918]
    paths: ['runtime/**', '.github/workflows/offline-runtime.yml']
  pull_request:
    paths: ['runtime/**', '.github/workflows/offline-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            runtime
            design/code-architecture
            .github/workflows
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Foundation static and Python checks only
        run: |
          python runtime/tools/check_source.py
          python -m unittest discover -s runtime/tools/tests -v
      - name: Offline gameplay verification
        working-directory: runtime/dotnet
        run: python tools/verify.py
      - name: Preserve actual offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-runtime-${{ matrix.os }}-${{ github.run_id }}
          path: runtime/dotnet/artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Package exact first-party source inputs
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git archive --format=tar -o runtime-inputs.tar HEAD runtime design/code-architecture design/GAME_SPEC.md design/ENGINE_DECISION.md AGENTS.md README.md .github/workflows/offline-runtime.yml
      - name: Preserve source inputs
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-runtime-inputs-${{ github.run_id }}
          path: runtime-inputs.tar
          if-no-files-found: error
          retention-days: 30
