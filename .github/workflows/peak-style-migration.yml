name: Apply PEAK-led style migration

on:
  push:
    branches: ['art/peak-style-rework']
    paths:
      - '.github/workflows/peak-style-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-style-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/peak-style-rework
          fetch-depth: 0
      - name: Apply and validate migration
        run: python3 .github/scripts/peak_style_migration.py
      - name: Commit migrated specifications
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GAME_SPEC.md docs/REACTOR_ROOM_VISUAL_SPEC.md
          git commit -m "Align remaining visual specs with PEAK-led direction"
          git push origin HEAD:art/peak-style-rework
